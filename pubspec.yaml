name: news_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0' # ✅ Compatible with Dart 3.3, good for Flutter 3.22+

dependencies:
  flutter:
    sdk: flutter

  excel: ^2.1.0

  # Core packages
  http: ^1.2.1
  intl: ^0.18.0
  provider: ^6.0.4
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Async state management
  flutter_mobx: ^2.2.1+1
  mobx: ^2.3.3+2

  # UI components
  cached_network_image: ^3.3.1
  dropdown_search: ^5.0.6
  webview_flutter: ^4.7.0
  fluttertoast: ^8.2.5
  # Utilities
  url_launcher: ^6.0.9
  connectivity_plus: ^2.3.0


  printing: ^5.13.1
  pdf: ^3.11.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.3.0
  mobx_codegen: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images.png
